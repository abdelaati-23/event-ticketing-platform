server:
  port: 8081 # The port your ticket-service will run on

spring:
  application:
    name: ticket-service # Crucial for Eureka

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/ticketing_db
    username: ${DB_USER:ticket_user}
    password: ${DB_PASSWORD:ticket_password}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:your_email@gmail.com}
    password: ${MAIL_PASSWORD:your_app_password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          ssl:
            trust: smtp.gmail.com

# Eureka Client Configuration
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true