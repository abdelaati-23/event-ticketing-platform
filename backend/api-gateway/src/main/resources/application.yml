server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false             # Disabled: rely on the explicit route below to avoid /TICKET-SERVICE/** conflicts
          lower-case-service-id: true # Allows lowercase service names in URLs
      routes:
        - id: ticket-service-route
          uri: lb://TICKET-SERVICE
          predicates:
            - Path=/api/**
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true