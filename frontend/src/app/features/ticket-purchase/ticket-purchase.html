<div style="border: 1px solid #ccc; padding: 20px; max-width: 300px; border-radius: 8px;">
  <h2>Epic Summer Concert</h2>
  <p>Prix : <strong>50.00 €</strong></p>

  <button
    (click)="purchase()"
    [disabled]="status() === 'loading'"
    style="padding: 10px 20px; cursor: pointer;">

    @if (status() === 'loading') {
      Traitement...
    } @else {
      Acheter le billet
    }

  </button>

  @if (status() === 'success') {
    <div style="margin-top: 1rem; display: flex; flex-direction: column; gap: 10px;">
      <p-message severity="success" [text]="message()"></p-message>
      <p-button
        label="Télécharger mon PDF"
        icon="pi pi-download"
        severity="info"
        (onClick)="downloadPdf()">
      </p-button>
    </div>
  }

  @if (status() === 'error') {
    <p style="color: red; font-weight: bold; margin-top: 15px;">{{ message() }}</p>
  }
</div>
