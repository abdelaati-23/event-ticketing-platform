<div style="display: flex; justify-content: center; margin-top: 5rem;">
  <p-card header="Connexion" [style]="{ width: '350px' }">
    <form style="display: flex; flex-direction: column; gap: 1.5rem;">

      <div style="display: flex; flex-direction: column; gap: 0.5rem;">
        <label for="email">Email</label>
        <input id="email" type="email" pInputText [(ngModel)]="email" name="email" required />
      </div>

      <div style="display: flex; flex-direction: column; gap: 0.5rem;">
        <label for="password">Mot de passe</label>
        <input id="password" type="password" pInputText [(ngModel)]="password" name="password" required />
      </div>

      <p-button
        label="Se connecter"
        icon="pi pi-sign-in"
        (onClick)="onSubmit()"
        [loading]="status() === 'loading'"
        [disabled]="!email() || !password()">
      </p-button>

      @if (status() === 'error') {
        <p-message severity="error" text="Identifiants incorrects."></p-message>
      }
    </form>
  </p-card>
</div>
